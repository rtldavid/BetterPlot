<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Draw</title>
<style>
:root{
  --bg:#2f2f2f; --panel:#3a3a3a; --panel-2:#333333; --chrome:#2b2b2b;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.18);
  --text:#e8e8e8; --text-dim:#9e9e9e;
  --accent:#3596db; --accent-2:#2980b9; --accent-soft:rgba(53,150,219,.12);
  --live:#5cb85c; --offline:#e35b5b;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font:13px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
#app{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:250px 1fr 300px;height:100%}
.bar{background:var(--chrome);display:flex;align-items:center;gap:4px;padding:5px 8px;flex-wrap:wrap}
.top{grid-column:1/-1;border-bottom:1px solid var(--line)}
.bottom{grid-column:1/-1;border-top:1px solid var(--line);font-size:12px;color:var(--text-dim);padding:3px 8px}
.bottom .spacer{flex:1}
.brand{font-weight:600;font-size:14px;margin-right:10px;letter-spacing:.1px}
.brand small{font-weight:400;color:var(--text-dim);margin-left:6px;font-size:11px}
.sep{width:1px;height:20px;background:var(--line-2);margin:0 5px}
button{background:transparent;color:var(--text);border:1px solid transparent;border-radius:4px;padding:4px 9px;font:inherit;cursor:pointer;line-height:1.2}
button:hover{background:var(--panel)}
button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{background:var(--accent-2)}
button.danger{color:var(--offline)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.small{padding:2px 6px;font-size:12px}
kbd{font:11px inherit;color:var(--text-dim);border:1px solid var(--line-2);border-radius:3px;padding:0 4px;margin-left:4px}
#palette{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#palette .hd{padding:8px 10px 6px;border-bottom:1px solid var(--line)}
#search{width:100%}
#plist{overflow:auto;flex:1;padding:4px 0 10px}
.pcat{font-size:11px;color:var(--text-dim);padding:10px 12px 3px}
.pitem{display:flex;align-items:center;gap:10px;padding:5px 12px;cursor:grab;user-select:none;-webkit-user-select:none}
.pitem:hover{background:var(--accent-soft)}
.pitem svg{width:30px;height:30px;flex:none;stroke:var(--text-dim);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pitem .nm{font-size:12.5px}
.pitem .io{font-size:10.5px;color:var(--text-dim);margin-left:auto;white-space:nowrap}
.empty{padding:14px 12px;color:var(--text-dim);font-size:12px}
#canvasWrap{position:relative;overflow:hidden;background:var(--bg);min-width:0}
svg#svg{width:100%;height:100%;display:block;touch-action:none;cursor:default;user-select:none;-webkit-user-select:none}
svg#svg.tool-pan{cursor:grab}
svg#svg.tool-draw{cursor:crosshair}
svg#svg.dragging{cursor:grabbing}
#ghost{position:fixed;pointer-events:none;z-index:50;background:var(--panel);border:1px solid var(--accent);border-radius:6px;padding:6px 10px;font-size:12px;display:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#props{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:10px 12px 20px;min-width:0}
#props h3{font-size:13px;font-weight:600;margin:4px 0 10px}
#props h4{font-size:12px;font-weight:600;color:var(--text-dim);margin:14px 0 6px}
.field{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:6px;margin:6px 0}
.field label{color:var(--text-dim);font-size:12px}
.row{display:flex;gap:6px;align-items:center}
.row > *{min-width:0}
input,select,textarea{background:var(--panel-2);color:var(--text);border:1px solid var(--line-2);border-radius:4px;padding:4px 6px;font:inherit;width:100%}
input[type=number]{width:100%}
input[type=color]{padding:0 2px;height:26px;width:40px;flex:none}
input[type=checkbox]{width:auto}
textarea{resize:vertical;min-height:60px}
table.ports{width:100%;border-collapse:collapse;font-size:12px}
table.ports th{text-align:left;color:var(--text-dim);font-weight:400;padding:2px 3px}
table.ports td{padding:2px 3px}
table.ports input{padding:3px 5px;font-size:12px}
.hint{color:var(--text-dim);font-size:11.5px;margin:6px 0}
.actions{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:12px;padding:1px 4px 1px 8px;font-size:11.5px}
.chip button{padding:0 5px;color:var(--text-dim)}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line-2);border-radius:8px;padding:16px 18px;width:380px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 12px;font-size:14px}
dialog .actions{justify-content:flex-end}
#toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line-2);color:var(--text);padding:6px 12px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .15s;pointer-events:none;z-index:60}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:900px){#app{grid-template-columns:180px 1fr 240px}}
</style>
</head>
<body>
<div id="app">
  <header class="bar top">
    <span class="brand">Video Draw<small>signal path diagrams</small></span>
    <button data-act="new">New</button>
    <button data-act="open">Open</button>
    <button data-act="save">Save</button>
    <span class="sep"></span>
    <button data-act="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button data-act="redo" title="Redo (Ctrl+Y)">Redo</button>
    <span class="sep"></span>
    <button data-tool="select" class="on" title="Select and move (V)">Select</button>
    <button data-tool="pan" title="Pan the canvas (H, or hold Space)">Pan</button>
    <button data-tool="rect" title="Draw a rectangle (R)">Rectangle</button>
    <button data-tool="ellipse" title="Draw an ellipse (E)">Ellipse</button>
    <button data-tool="line" title="Draw a line (L)">Line</button>
    <button data-tool="text" title="Place a text box (T)">Text</button>
    <span class="sep"></span>
    <button data-act="arrange" title="Auto arrange: layers left to right (landscape)">Arrange linear</button>
    <button data-act="arrangeFan" title="Auto arrange for portrait pages: hubs step down the page, single-port devices gather around the hub they connect to">Arrange portrait</button>
    <button data-act="clearPaths" title="Remove every signal path, keeping icons and shapes">Delete all paths</button>
    <button data-act="grid" id="btnGrid" class="on" title="Show grid (G)">Grid</button>
    <button data-act="snap" id="btnSnap" class="on" title="Snap to grid (S)">Snap</button>
    <span class="sep"></span>
    <button data-act="export" class="primary">Export</button>
    <span class="sep"></span>
    <button data-act="theme" id="btnTheme" title="Switch between dark and light mode">Light mode</button>
  </header>

  <aside id="palette">
    <div class="hd"><input id="search" type="search" placeholder="Search icons" autocomplete="off"></div>
    <div id="plist"></div>
  </aside>

  <div id="canvasWrap">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg">
      <g id="world">
        <g class="lGrid"></g><g class="lShapes"></g><g class="lEdges"></g><g class="lNodes"></g><g class="lOverlay"></g>
      </g>
    </svg>
    <div id="ghost"></div>
  </div>

  <aside id="props"></aside>

  <footer class="bar bottom">
    <span id="status">Ready</span>
    <span class="spacer"></span>
    <span id="hint">Drag from a port to connect. Drop a connection onto an existing line to bundle it.</span>
    <span class="sep"></span>
    <button class="small" data-act="zoomOut">−</button>
    <span id="zoomLbl" style="min-width:42px;text-align:center">100%</span>
    <button class="small" data-act="zoomIn">+</button>
    <button class="small" data-act="fit" title="Fit the whole diagram">Fit</button>
    <button class="small" data-act="zoomSel" title="Zoom to the selected items (Z)">Zoom to selection</button>
  </footer>
</div>

<dialog id="dlgExport">
  <h3>Export diagram</h3>
  <div class="field"><label>Format</label><select id="exFmt"><option value="png">PNG image</option><option value="pdf">PDF</option></select></div>
  <div class="field"><label>Print theme</label><select id="exTheme"><option value="light">Light</option><option value="dark">Dark</option></select></div>
  <div class="field"><label>Page size</label><select id="exPage">
    <option value="auto">Diagram size (no page)</option>
    <option value="letter">Letter 8.5 × 11 in</option>
    <option value="legal">Legal 8.5 × 14 in</option>
    <option value="tabloid">Tabloid 11 × 17 in</option>
    <option value="a4">A4 210 × 297 mm</option>
    <option value="a3">A3 297 × 420 mm</option>
    <option value="a5">A5 148 × 210 mm</option>
  </select></div>
  <div class="field exPageOpt"><label>Orientation</label><select id="exOrient"><option value="auto">Match diagram</option><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select></div>
  <div class="field exPageOpt"><label>Fit to page</label><label class="row"><input type="checkbox" id="exFit" checked> scale the diagram to fill the printable area</label></div>
  <div class="field exPageOpt"><label>Margin</label><select id="exMargin"><option value="0.5">0.5 in</option><option value="1" selected>1 in</option></select></div>
  <div class="field"><label>Resolution</label><select id="exDpi"><option value="150">150 dpi</option><option value="300" selected>300 dpi</option><option value="600">600 dpi</option></select></div>
  <div class="field"><label>Grid</label><input type="checkbox" id="exGrid"></div>
  <div class="field" id="exTransRow"><label>Background</label><label class="row"><input type="checkbox" id="exTrans"> transparent (PNG only)</label></div>
  <div class="hint" id="exInfo"></div>
  <div class="actions"><button data-act="exCancel">Cancel</button><button class="primary" data-act="exGo">Export</button></div>
</dialog>

<input type="file" id="fileOpen" accept=".json,application/json" hidden>
<div id="toast"></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const NS = 'http://www.w3.org/2000/svg';
const NODE_W = 200, HEAD = 26, PITCH = 20, PAD = 14, STUB = 24, G = 10, MARGIN = 14, TURN = 12, TB = 16;
const FONT = '-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
let uidCounter = 1;
const nid = () => 'k' + (uidCounter++).toString(36) + Math.random().toString(36).slice(2, 6);

const THEMES = {
  dark: { bg:'#2f2f2f', panel:'#3a3a3a', panel2:'#333333', chrome:'#2b2b2b',
    line:'rgba(255,255,255,.09)', line2:'rgba(255,255,255,.18)', text:'#e8e8e8', dim:'#9e9e9e',
    accent:'#3596db', accent2:'#2980b9', soft:'rgba(53,150,219,.12)', live:'#5cb85c', offline:'#e35b5b',
    grid:'rgba(255,255,255,.07)', paper:'#2f2f2f', warn:'#f2c230' },
  light: { bg:'#c6c6c6', panel:'#dcdcdc', panel2:'#ebebeb', chrome:'#d2d2d2',
    line:'rgba(0,0,0,.12)', line2:'rgba(0,0,0,.26)', text:'#1e1e1e', dim:'#5e5e5e',
    accent:'#2980b9', accent2:'#1f6a9a', soft:'rgba(41,128,185,.12)', live:'#3f9a3f', offline:'#c94444',
    grid:'rgba(0,0,0,.09)', paper:'#ffffff', warn:'#d9a400' }
};
const CSS_MAP = { bg:'--bg', panel:'--panel', panel2:'--panel-2', chrome:'--chrome', line:'--line', line2:'--line-2',
  text:'--text', dim:'--text-dim', accent:'--accent', accent2:'--accent-2', soft:'--accent-soft', live:'--live', offline:'--offline' };

// Icon primitives. inputs/outputs = defaults; cfg = user can change counts.
const TYPES = {
  camera:    { name:'Camera',             cat:'Sources',    inputs:0, outputs:1, icon:'camera' },
  computer:  { name:'Computer',           cat:'Sources',    inputs:0, outputs:1, cfgOut:true, icon:'computer' },
  gin:       { name:'Generic input',      cat:'Generic',    inputs:0, outputs:1, icon:'gin' },
  gout:      { name:'Generic output',     cat:'Generic',    inputs:1, outputs:0, icon:'gout' },
  router:    { name:'Router matrix',      cat:'Switching',  inputs:8, outputs:8, cfgIn:true, cfgOut:true, icon:'router' },
  vswitch:   { name:'Video switch',       cat:'Switching',  inputs:8, outputs:2, cfgIn:true, cfgOut:true, icon:'vswitch', outLabels:['Program','Multiview'] },
  atem1:     { name:'ATEM 1 Constellation', cat:'Switching', inputs:10, outputs:9, icon:'atem1',
               outLabels:['OUT 1','OUT 2','OUT 3','OUT 4','OUT 5','OUT 6','Multiview','Audio L','Audio R'] },
  atemmini:  { name:'ATEM Mini',          cat:'Switching',  inputs:4, outputs:2, icon:'atemmini' },
  da:        { name:'DA',                 cat:'Distribution', inputs:1, outputs:8, cfgOut:true, icon:'da' },
  conv:      { name:'SDI / HDMI converter', cat:'Distribution', inputs:1, outputs:1, cfgIn:true, cfgOut:true, icon:'conv' },
  hyperdeck: { name:'HyperDeck Studio',   cat:'Recording',  inputs:1, outputs:2, icon:'hyperdeck',
               inLabels:['SDI IN'], outLabels:['HDMI OUT','SDI OUT'] },
  recorder:  { name:'Recorder',           cat:'Recording',  inputs:1, outputs:0, cfgIn:true, cfgOut:true, icon:'recorder' },
  tv:        { name:'TV',                 cat:'Displays',   inputs:1, outputs:0, cfgIn:true, cfgOut:true, icon:'tv' },
  projector: { name:'Projector',          cat:'Displays',   inputs:1, outputs:0, cfgIn:true, cfgOut:true, icon:'projector' },
  monitor:   { name:'Monitor',            cat:'Displays',   inputs:1, outputs:0, cfgIn:true, cfgOut:true, icon:'monitor' },
};
const CAT_ORDER = ['Sources','Switching','Distribution','Recording','Displays','Generic'];

// 40x40 line-art glyphs, stroke = currentColor
const ICONS = {
  camera: '<rect x="5" y="14" width="20" height="14" rx="2"/><path d="M25 19l10-5v12l-10-5z"/><circle cx="15" cy="21" r="4"/><path d="M9 14V9h8"/>',
  computer: '<rect x="6" y="8" width="28" height="18" rx="2"/><path d="M20 26v5M13 31h14"/><path d="M11 13h6" opacity=".6"/>',
  gin: '<path d="M8 11v18"/><path d="M8 20h24M27 15l5 5-5 5"/>',
  gout: '<path d="M32 11v18"/><path d="M6 20h22M23 15l5 5-5 5"/>',
  da: '<path d="M4 20h10"/><path d="M14 20h22M14 20l10-9h12M14 20l10 9h12M14 20l10-4h12M14 20l10 4h12"/>',
  router: '<path d="M8 12h24M8 20h24M8 28h24M12 8v24M20 8v24M28 8v24"/><circle cx="12" cy="20" r="2.2" fill="currentColor"/><circle cx="20" cy="12" r="2.2" fill="currentColor"/><circle cx="28" cy="28" r="2.2" fill="currentColor"/>',
  vswitch: '<path d="M5 12h9l10 8h10M5 20h9M5 28h9l10-8"/><circle cx="24" cy="20" r="2.4" fill="currentColor"/>',
  tv: '<rect x="6" y="11" width="28" height="19" rx="2"/><path d="M13 34h14M14 11l6-6 6 6"/>',
  projector: '<rect x="5" y="14" width="22" height="12" rx="2"/><circle cx="21" cy="20" r="3"/><path d="M27 17l8-4v14l-8-4M9 26v4M23 26v4"/>',
  monitor: '<rect x="6" y="8" width="28" height="18" rx="2"/><path d="M20 26v5M13 31h14M6 22h28"/>',
  recorder: '<rect x="5" y="10" width="30" height="20" rx="2"/><circle cx="14" cy="20" r="4"/><circle cx="26" cy="20" r="4"/><path d="M14 25h12"/>',
  conv: '<rect x="5" y="12" width="30" height="16" rx="2"/><path d="M10 17h14l-3-3M24 17l-3 3M30 23H16l3-3M16 23l3 3"/>',
  atem1: '<rect x="3" y="14" width="34" height="12" rx="1"/><path d="M7 18h2M11 18h2M15 18h2M19 18h2M23 18h2M7 22h2M11 22h2M15 22h2M19 22h2M23 22h2"/><rect x="29" y="17" width="5" height="6"/>',
  hyperdeck: '<rect x="3" y="14" width="34" height="12" rx="1"/><rect x="6" y="17" width="12" height="6"/><circle cx="30" cy="20" r="3"/><path d="M21 18h5M21 22h5"/>',
  atemmini: '<rect x="4" y="12" width="32" height="16" rx="2"/><path d="M8 17h3M13 17h3M18 17h3M23 17h3M8 23h3M13 23h3M18 23h3"/><rect x="29" y="16" width="4" height="9"/>',
};
function iconSvg(key, cls) {
  return '<svg viewBox="0 0 40 40" class="' + (cls || '') + '">' + ICONS[key] + '</svg>';
}

// ---------- document state ----------
let state = blankDoc();
function blankDoc() {
  return { title:'Untitled diagram', nodes:[], edges:[], shapes:[], grid:20, showGrid:true, snap:true,
    defaults:{ stroke:'auto', width:2, dash:'solid' } };
}
const ui = { theme:'dark', tool:'select', sel:new Set(), view:{ x:80, y:80, z:1 }, hoverPort:null, space:false };
let routes = new Map();
const undoStack = [], redoStack = [];

function pushUndo() { undoStack.push(JSON.stringify(state)); if (undoStack.length > 120) undoStack.shift(); redoStack.length = 0; }
function undo() { if (!undoStack.length) return; redoStack.push(JSON.stringify(state)); state = JSON.parse(undoStack.pop()); pruneSelection(); refresh(true); }
function redo() { if (!redoStack.length) return; undoStack.push(JSON.stringify(state)); state = JSON.parse(redoStack.pop()); pruneSelection(); refresh(true); }

function snap(v) { return state.snap ? Math.round(v / state.grid) * state.grid : Math.round(v); }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

// ---------- ports & nodes ----------
function defaultLabel(side, i, n) {
  const base = side === 'in' ? 'IN' : 'OUT';
  return n === 1 ? base : base + ' ' + (i + 1);
}
function makePorts(t, side, n, old) {
  const preset = side === 'in' ? t.inLabels : t.outLabels;
  const arr = [];
  for (let i = 0; i < n; i++) {
    const o = old && old[i];
    arr.push({ id: o ? o.id : nid(), label: o ? o.label : ((preset && preset[i]) || defaultLabel(side, i, n)), sig: o ? o.sig : '' });
  }
  return arr;
}
const SIDE_DIR = { right: 0, bottom: 1, left: 2, top: 3 };           // outward direction of each node side (E S W N)
function portSide(n, io) {
  const list = io === 'in' ? n.inputs : n.outputs;
  const want = n.sides && n.sides[io];
  if (list.length === 1 && want && SIDE_DIR[want] != null) return want;
  return io === 'in' ? 'left' : 'right';
}
function nodeLayout(n) {
  const inS = portSide(n, 'in'), outS = portSide(n, 'out');
  const rowsIn = (inS === 'left' || inS === 'right') ? n.inputs.length : 0;
  const rowsOut = (outS === 'left' || outS === 'right') ? n.outputs.length : 0;
  const top = inS === 'top' || outS === 'top', bottom = inS === 'bottom' || outS === 'bottom';
  return { inS, outS, rows: Math.max(rowsIn, rowsOut, 1), top, bottom };
}
// Port centres always land on the same 20px phase (node.y + 50 + 20k), so any two ports can be
// brought level by moving an icon on the snap grid.
function sizeNode(n) {
  n.w = NODE_W;
  const L = nodeLayout(n);
  n.h = HEAD + 2 * PAD + L.rows * PITCH + (L.top ? TB : 0) + (L.bottom ? TB : 0);
}
function createNode(type, x, y) {
  const t = TYPES[type];
  const n = { id: nid(), type, x, y, name: t.name, inputs: makePorts(t, 'in', t.inputs), outputs: makePorts(t, 'out', t.outputs), sides: { in: 'left', out: 'right' } };
  sizeNode(n);
  return n;
}
function setPortCount(n, side, count) {
  const t = TYPES[n.type];
  count = clamp(Math.round(count), 0, 64);
  const key = side === 'in' ? 'inputs' : 'outputs';
  const old = n[key];
  n[key] = makePorts(t, side, count, old);
  const removed = new Set(old.slice(count).map(p => p.id));
  if (removed.size) {
    for (const e of state.edges) { e.a = e.a.filter(pid => !removed.has(pid)); e.b = e.b.filter(pid => !removed.has(pid)); }
    state.edges = state.edges.filter(e => hasReal(e.a) && hasReal(e.b));
  }
  sizeNode(n);
}
function portPos(n, io, i) {
  const L = nodeLayout(n);
  const side = io === 'in' ? L.inS : L.outS;
  if (side === 'top') return { x: n.x + n.w / 2, y: n.y, side };
  if (side === 'bottom') return { x: n.x + n.w / 2, y: n.y + n.h, side };
  const list = io === 'in' ? n.inputs : n.outputs;
  const top = n.y + HEAD + PAD + (L.top ? TB : 0) + Math.floor((L.rows - list.length) / 2) * PITCH;
  return { x: side === 'left' ? n.x : n.x + n.w, y: top + PITCH * (i + 0.5), side };
}
function labelExt(port, side) { return (port.sig && (side === 'left' || side === 'right')) ? Math.ceil(port.sig.length * 5.4 + 8) : 0; }
function nodeLabelExt(n, io) { const side = portSide(n, io); return Math.max(0, ...(io === 'in' ? n.inputs : n.outputs).map(p => labelExt(p, side))); }
const isPending = ref => typeof ref === 'string' && ref.startsWith('pending:');
const hasReal = list => list.some(r => !isPending(r));
function findPort(pid) {
  for (const n of state.nodes) {
    let i = n.inputs.findIndex(p => p.id === pid);

function contentBounds() {
  let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
  const add = (x, y, w, h) => { minx = Math.min(minx, x); miny = Math.min(miny, y); maxx = Math.max(maxx, x + w); maxy = Math.max(maxy, y + h); };
  for (const n of state.nodes) {
    const ext = io => Math.max(0, ...(io === 'in' ? n.inputs : n.outputs).map(p => labelExt(p, portSide(n, io))));
    const L = nodeLayout(n);
    const left = 12 + (L.inS === 'left' ? ext('in') : 0) + (L.outS === 'left' ? ext('out') : 0), right = 12 + (L.inS === 'right' ? ext('in') : 0) + (L.outS === 'right' ? ext('out') : 0);

  for (const s of state.shapes) { const b = shapeBox(s); add(b.x, b.y, b.w, b.h); }

  for (const n of state.nodes) if (ids.has(n.id)) { n.inputs.forEach(p => gonePorts.add(p.id)); n.outputs.forEach(p => gonePorts.add(p.id)); }
  state.nodes = state.nodes.filter(n => !ids.has(n.id));

  state.edges = state.edges.filter(e => !ids.has(e.id));

    for (const p of c.inputs.concat(c.outputs)) { const old = p.id; p.id = nid(); map.set(old, p.id); }

// ---------- edges ----------
function connectPorts(pidA, pidB) {
  const A = findPort(pidA), B = findPort(pidB);
  if (!A || !B) return false;
  if (A.side === B.side) { toast('Connect an output to an input'); return false; }
  const src = A.side === 'out' ? pidA : pidB, dst = A.side === 'out' ? pidB : pidA;
  if (state.edges.some(e => e.a.length === 1 && e.b.length === 1 && e.a[0] === src && e.b[0] === dst)) return false;
  pushUndo();
  state.edges.push({ id: nid(), a: [src], b: [dst], stroke: state.defaults.stroke, width: state.defaults.width, dash: state.defaults.dash, count: 1, label: '' });
  return true;
}
function addPortToEdge(edge, pid) {
  const P = findPort(pid); if (!P) return false;

  const slot = edge[key].findIndex(isPending);

  edge.count = Math.max(edge.count || 1, edge.a.length, edge.b.length);
  if (edge[other].some(isPending)) toast('The other end of the bundle now has an open stub — drag it to a port');
  return true;
}

  if (edge[key].includes(pid)) { toast('That port is already on this path'); return false; }
  const i = edge[key].indexOf(ref); if (i < 0) return false;

}
function hoverTargets(ev) {

  const c = sel => (hover && hover.closest) ? hover.closest(sel) : null;

svg.addEventListener('pointerdown', ev => {

    drag = { kind: 'draw', start: { x: snap(wp.x), y: snap(wp.y) }, shape: null }; return;
  }
  const handle = t.closest('[data-handle]');

function layeredOrder(exclude) {

  // the port pair joining two adjacent nodes u (nearer the hub) and v
  const link = (u, v) => {
    for (const e of state.edges) for (const pa of e.a) for (const pb of e.b) {
      const A = isPending(pa) ? null : findPort(pa), B = isPending(pb) ? null : findPort(pb); if (!A || !B) continue;
      const ia = idx.get(A.node.id), ib = idx.get(B.node.id);
      if (ia === u && ib === v) return { u: A, v: B, feeds: false };
      if (ia === v && ib === u) return { u: B, v: A, feeds: true };
    }
    return null;
  };
  const GX = 90, GY = 100, ROWX = 40, GAP_ROW = 40, PH = 74;
  const kidsOf = u => nb(u).filter(v => parent[v] === u);
  const chainLen = i => { let l = 0, u = i; for (;;) { const k = kidsOf(u); if (!k.length) break; l++; u = k[0]; } return l; };
  const setSides = (i, io, side) => { const n = nodes[i]; n.sides = n.sides || { in: 'left', out: 'right' }; n.sides[io] = side; };
  const orient = (i, slot) => { // rows and chains keep left/right ports; a lone single-port device beside/above/below faces the hub
    const n = nodes[i];
    const single = n.inputs.length + n.outputs.length === 1;
    if (!single || slot === 'left' || slot === 'right') {
      if (slot === 'left' || slot === 'right') {
        const toward = slot === 'left' ? 'right' : 'left', away = slot;
        const L = link(parent[i], i);
        if (L && L.feeds) { setSides(i, 'out', toward); setSides(i, 'in', away); } else { setSides(i, 'in', toward); setSides(i, 'out', away); }
      } else { setSides(i, 'in', 'left'); setSides(i, 'out', 'right'); }
    } else if (slot === 'row') { setSides(i, 'in', 'left'); setSides(i, 'out', 'right'); }
    else if (n.inputs.length) { setSides(i, 'in', slot === 'top' ? 'bottom' : 'right'); setSides(i, 'out', 'right'); } // sink: fed from the hub's output side
    else { setSides(i, 'out', 'left'); setSides(i, 'in', 'left'); }                                                    // source: runs down the hub's input side
    sizeNode(n);
  };
  const portY = (i, P) => portPos(nodes[i], P.side, P.index).y - nodes[i].y;   // port offset inside its icon
  const rel = new Map(), slotOf = new Map();
  // does device i use the same side for its hub link and its onward chain? (then a row placement forces a crossing)
  const sameSide = i => { const L = link(parent[i], i); if (!L) return false; for (const v of kidsOf(i)) { const K = link(i, v); if (K && K.u.side === L.v.side) return true; } return false; };
  const placeChain = (u, slot) => {
    const pu = rel.get(u), nu = nodes[u];
    kidsOf(u).forEach((v, k) => {
      const L = link(u, v);
      orient(v, slot === 'left' || slot === 'right' ? slot : 'row'); slotOf.set(v, slot);
      let dy = L ? portY(u, L.u) - portY(v, L.v) : 0;   // level the joined ports
      if (slot === 'left' || slot === 'right') {
        // the parent's port toward this child faces the hub, so the line has to wrap under the parent: drop the child below it
        const wraps = L && ((slot === 'left') === !L.feeds);
        if (wraps) dy = nu.h + 30 - (L ? portY(v, L.v) : 0);
        const gx = GX + nodeLabelExt(nodes[v], 'in') + nodeLabelExt(nodes[v], 'out') + nodeLabelExt(nu, 'in') + nodeLabelExt(nu, 'out');
        rel.set(v, { x: slot === 'left' ? pu.x - (NODE_W + gx) : pu.x + NODE_W + gx, y: pu.y + dy + k * (PH + GAP_ROW) });
      } else { const rx = ROWX + nodeLabelExt(nodes[v], 'in') + nodeLabelExt(nodes[v], 'out') + nodeLabelExt(nu, 'in') + nodeLabelExt(nu, 'out'); rel.set(v, { x: pu.x + (L && L.feeds ? -(NODE_W + rx) : NODE_W + rx), y: pu.y + dy + k * (PH + GAP_ROW) }); } // rows: sources to the left, sinks to the right
      placeChain(v, slot);
    });
  };
  for (let h = 0; h < N; h++) {
    if (!hub[h]) continue;
    const H = nodes[h]; rel.set(h, { x: 0, y: 0 });
    const direct = []; for (let i = 0; i < N; i++) if (depth[i] === 1 && parent[i] === h) direct.push(i);
    const info = new Map(direct.map(i => { const L = link(h, i); return [i, { L, feeds: L ? L.feeds : false, pidx: L ? L.u.index : 0, pn: L ? (L.u.side === 'in' ? H.inputs.length : H.outputs.length) : 1 }]; }));
    const byPort = (a, b) => info.get(a).pidx - info.get(b).pidx;
    const rows = { top: [], bottom: [] };
    for (const [slot, list] of [['left', direct.filter(i => info.get(i).feeds)], ['right', direct.filter(i => !info.get(i).feeds)]]) {
      let beside = list.slice().sort(byPort);
      // long chains run along the row above or below the hub (keeps the page narrow); short ones sit beside it
      for (const i of beside.slice()) if (chainLen(i) >= 2 && !sameSide(i)) { beside = beside.filter(x => x !== i); rows[info.get(i).pidx < info.get(i).pn / 2 ? 'top' : 'bottom'].push(i); }
      const cap = Math.max(1, Math.ceil((H.h + GAP_ROW) / (PH + GAP_ROW)));
      // too many for the side column: spill to the rows above/below, taking the most extreme ports first and
      // keeping devices whose chain would cross in a row beside the hub
      const extremity = i => Math.abs(info.get(i).pidx + 0.5 - info.get(i).pn / 2);
      const spill = beside.slice().sort((a, b) => (sameSide(a) ? 1 : 0) - (sameSide(b) ? 1 : 0) || extremity(b) - extremity(a) || info.get(b).pidx - info.get(a).pidx);
      for (let k = 0; beside.length > cap && k < spill.length; k++) {
        const i = spill[k]; beside = beside.filter(x => x !== i);
        rows[info.get(i).pidx < info.get(i).pn / 2 ? 'top' : 'bottom'].push(i);
      }
      // beside: level each device with the hub port it uses, pushing down where they would overlap
      let yPrev = -Infinity;
      for (const i of beside) {
        orient(i, slot); slotOf.set(i, slot);
        const inf = info.get(i);
        let y = inf.L ? portY(h, inf.L.u) - portY(i, inf.L.v) : 0;
        if (y < yPrev) y = yPrev;
        const gx = GX + nodeLabelExt(nodes[i], slot === 'left' ? 'out' : 'in') + nodeLabelExt(H, slot === 'left' ? 'in' : 'out');
        rel.set(i, { x: slot === 'left' ? -(NODE_W + gx) : NODE_W + gx, y });
        // a chain partner that has to wrap under this device needs a clear corridor below it
        const wrapsBelow = kidsOf(i).some(v => { const L = link(i, v); return L && ((slot === 'left') === !L.feeds); });
        yPrev = y + nodes[i].h + GAP_ROW + (wrapsBelow ? 30 : 0);
      }
    }
    for (const slot of ['top', 'bottom']) {
      const items = rows[slot]; if (!items.length) continue;
      items.sort((a, b) => (info.get(b).feeds ? 1 : 0) - (info.get(a).feeds ? 1 : 0) || byPort(a, b)); // sources left, sinks right, each in port order
      for (const i of items) orient(i, slot);
      const groupW = i => (chainLen(i) + 1) * NODE_W + chainLen(i) * ROWX;
      const totalW = items.reduce((s, i) => s + groupW(i), 0) + ROWX * (items.length - 1);
      const rowH = Math.max(...items.map(i => nodes[i].h)) + 30;
      let x = H.w / 2 - totalW / 2;
      for (const i of items) {
        const headX = info.get(i).feeds ? x + chainLen(i) * (NODE_W + ROWX) : x;
        rel.set(i, { x: headX, y: slot === 'top' ? -(rowH + GY) : H.h + GY }); slotOf.set(i, slot);
        x += groupW(i) + ROWX;
      }
    }
    for (const i of direct) placeChain(i, slotOf.get(i));
  }
  const cells = new Map();
  for (let h = 0; h < N; h++) if (hub[h]) {
    let minx = 0, miny = 0, maxx = nodes[h].w, maxy = nodes[h].h;
    for (let i = 0; i < N; i++) if (attach[i] === h && rel.has(i)) { const p = rel.get(i); minx = Math.min(minx, p.x); miny = Math.min(miny, p.y); maxx = Math.max(maxx, p.x + nodes[i].w); maxy = Math.max(maxy, p.y + nodes[i].h); }
    cells.set(h, { minx, miny, w: maxx - minx, h: maxy - miny });
  }
  // staircase: each layer of hubs sits below the previous one and starts just right of the previous hub's
  // output side, so trunks run right then down into the next inputs; same-layer hubs stack in port order
  const hubCols = cols.map(c => c.filter(i => hub[i])).filter(c => c.length);
  const STAIR = 140, CGY = 90;
  let y = 0, prevRight = null;
  for (const col of hubCols) {
    let hubX = 0;
    if (prevRight != null) { const leftW = Math.max(...col.map(h => -cells.get(h).minx)); hubX = prevRight + STAIR + leftW; }
    for (const h of col) {
      const c = cells.get(h);
      const hy = y - c.miny;
      for (let i = 0; i < N; i++) if (attach[i] === h && rel.has(i)) { const p = rel.get(i); nodes[i].x = snap(hubX + p.x); nodes[i].y = snap(hy + p.y); }
      y += c.h + CGY;
    }
    prevRight = hubX + NODE_W;
  }
  let ix = 0;
  for (const i of isolated) { const n = nodes[i]; n.sides = { in: 'left', out: 'right' }; sizeNode(n); n.x = snap(ix); n.y = snap(y + 20); ix += NODE_W + ROWX; }
  for (const e of state.edges) delete e.route;
}

// ---------- file I/O ----------
function download(name, blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
function safeName() { return (state.title || 'diagram').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_') || 'diagram'; }
function saveJson() { download(safeName() + '.videodraw.json', new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' })); toast('Saved ' + safeName() + '.videodraw.json'); }
function loadDoc(obj) {
  const d = blankDoc();
  Object.assign(d, obj);
  d.defaults = Object.assign(blankDoc().defaults, obj.defaults || {});
  for (const n of d.nodes) { if (!TYPES[n.type]) n.type = 'gin'; n.inputs = n.inputs || []; n.outputs = n.outputs || []; n.sides = n.sides || { in: 'left', out: 'right' }; sizeNode(n); }
  d.edges = (d.edges || []).filter(e => e.a && e.b);
  state = d; ui.sel.clear(); undoStack.length = 0; redoStack.length = 0;
  refresh(true); fitView();
}
$('#fileOpen').addEventListener('change', ev => {
  const f = ev.target.files[0]; if (!f) return;
  f.text().then(txt => { try { loadDoc(JSON.parse(txt)); toast('Opened ' + f.name); } catch (e) { toast('That file is not a Video Draw diagram.'); } });
  ev.target.value = '';
});

// ---------- export ----------
const PAGES = { letter: [8.5, 11], legal: [8.5, 14], tabloid: [11, 17], a4: [8.27, 11.69], a3: [11.69, 16.54], a5: [5.83, 8.27] };
function exportPlan() {
  const page = $('#exPage').value, dpi = +$('#exDpi').value, fit = $('#exFit').checked, margin = +$('#exMargin').value;
  const b = contentBounds(); b.x -= 20; b.y -= 20; b.w += 40; b.h += 40;
  let inW, inH, scale, ox, oy;   // scale: inches per diagram pixel; ox/oy: inch offset of the diagram origin
  if (page === 'auto') { scale = 1 / 96; inW = b.w * scale + 0.4; inH = b.h * scale + 0.4; ox = 0.2 - b.x * scale; oy = 0.2 - b.y * scale; }
  else {
    let [pw, ph] = PAGES[page];
    const orient = $('#exOrient').value;
    if (orient === 'landscape' || (orient === 'auto' && b.w > b.h)) [pw, ph] = [ph, pw];
    inW = pw; inH = ph;
    const aw = pw - 2 * margin, ah = ph - 2 * margin;
    scale = fit ? Math.min(aw / b.w, ah / b.h) : 1 / 96;
    ox = margin + (aw - b.w * scale) / 2 - b.x * scale; oy = margin + (ah - b.h * scale) / 2 - b.y * scale;
  }
  return { inW, inH, scale, ox, oy, dpi, pxW: Math.round(inW * dpi), pxH: Math.round(inH * dpi), page, bounds: b };
}
function updateExportInfo() {
  const page = $('#exPage').value;
  $$('.exPageOpt').forEach(el => el.style.display = page === 'auto' ? 'none' : '');
  $('#exTransRow').style.display = $('#exFmt').value === 'png' ? '' : 'none';
  const P = exportPlan();
  const pct = Math.round(P.scale * 96 * 100);
  $('#exInfo').textContent = P.inW.toFixed(2) + ' × ' + P.inH.toFixed(2) + ' in · ' + P.pxW + ' × ' + P.pxH + ' px · diagram at ' + pct + '%' +
    (P.page !== 'auto' && !$('#exFit').checked && pct === 100 && (P.bounds.w / 96 > P.inW || P.bounds.h / 96 > P.inH) ? ' — larger than the page, it will be cropped' : '');
}
function buildExportSvg(th, P, showGrid, transparent) {
  const root = document.createElementNS(NS, 'svg');
  root.setAttribute('xmlns', NS);
  root.setAttribute('width', P.pxW); root.setAttribute('height', P.pxH);
  root.setAttribute('viewBox', '0 0 ' + P.inW + ' ' + P.inH);
  root.setAttribute('font-family', FONT);
  if (!transparent) el('rect', { x: 0, y: 0, width: P.inW, height: P.inH, fill: th.paper }, root);
  th = Object.assign({}, th, { canvas: transparent ? 'none' : th.paper });
  const clip = el('clipPath', { id: 'pageClip' }, el('defs', {}, root));
  el('rect', { x: 0, y: 0, width: P.inW, height: P.inH }, clip);
  const outer = el('g', { 'clip-path': 'url(#pageClip)' }, root);   // clip in page space, then place the diagram inside
  const cont = el('g', { transform: 'translate(' + P.ox + ' ' + P.oy + ') scale(' + P.scale + ')' }, outer);
  ['lGrid', 'lShapes', 'lEdges', 'lNodes'].forEach(c => el('g', { class: c }, cont));
  if (showGrid) { const gl = cont.querySelector('.lGrid'); renderGrid(gl, th, state.grid, true); const r = gl.querySelector('rect'); const b = P.bounds; r.setAttribute('x', b.x); r.setAttribute('y', b.y); r.setAttribute('width', b.w); r.setAttribute('height', b.h); }
  renderShapes(cont.querySelector('.lShapes'), th, false);
  renderEdges(cont.querySelector('.lEdges'), th, false);
  renderNodes(cont.querySelector('.lNodes'), th, false);
  return root;
}
function svgToCanvas(svgEl, w, h) {
  return new Promise((resolve, reject) => {
    const xml = new XMLSerializer().serializeToString(svgEl);
    const url = URL.createObjectURL(new Blob([xml], { type: 'image/svg+xml;charset=utf-8' }));
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('render failed')); };
    img.src = url;
  });
}
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function doExport() {
  const fmt = $('#exFmt').value, th = THEMES[$('#exTheme').value];
  const P = exportPlan();
  if (P.pxW * P.pxH > 120e6) { toast('That page and resolution is too large to render in the browser — lower the resolution'); return; }
  const svgEl = buildExportSvg(th, P, $('#exGrid').checked, fmt === 'png' && $('#exTrans').checked);
  $('#dlgExport').close();
  setStatus('Exporting…');
  try {
    const canvas = await svgToCanvas(svgEl, P.pxW, P.pxH);
    if (fmt === 'png') {
      canvas.toBlob(blob => { download(safeName() + '.png', blob); toast('Exported ' + safeName() + '.png'); setStatus('Ready'); }, 'image/png');
      return;
    }
    if (!window.jspdf) {
      try { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'); }
      catch (e) {
        const win = window.open('', '_blank');
        if (!win) { toast('PDF library unavailable offline and the print window was blocked — export PNG instead'); setStatus('Ready'); return; }
        win.document.write('<!DOCTYPE html><title>' + esc(state.title) + '</title><style>body{margin:0;background:' + th.paper + '}img{width:' + P.inW + 'in;height:' + P.inH + 'in;display:block}@page{size:' + P.inW + 'in ' + P.inH + 'in;margin:0}</style><img src="' + canvas.toDataURL('image/png') + '">');
        win.document.close(); win.focus(); setTimeout(() => win.print(), 300);
        setStatus('Ready'); toast('PDF library unavailable offline — use the print dialog to save as PDF'); return;
      }
    }
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: P.inW > P.inH ? 'landscape' : 'portrait', unit: 'in', format: [P.inW, P.inH], compress: true });
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, P.inW, P.inH, undefined, 'FAST');
    pdf.save(safeName() + '.pdf');
    toast('Exported ' + safeName() + '.pdf');
  } catch (e) { console.error(e); toast('Export failed: ' + e.message); }
  setStatus('Ready');
}

// ---------- toolbar ----------
document.addEventListener('click', ev => {
  const tb = ev.target.closest('[data-tool]'); if (tb) { setTool(tb.dataset.tool); return; }
  const b = ev.target.closest('header [data-act], footer [data-act], dialog [data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'new') { if (!state.nodes.length && !state.shapes.length || confirm('Start a new diagram? Unsaved changes will be lost.')) { state = blankDoc(); ui.sel.clear(); undoStack.length = 0; redoStack.length = 0; ui.view = { x: 80, y: 80, z: 1 }; setView(); refresh(true); } }
  else if (act === 'open') $('#fileOpen').click();
  else if (act === 'save') saveJson();
  else if (act === 'undo') undo();
  else if (act === 'redo') redo();
  else if (act === 'arrange') autoArrange('linear');
  else if (act === 'arrangeFan') autoArrange('fanout');
  else if (act === 'clearPaths') {
    if (!state.edges.length) { toast('There are no paths to delete'); return; }
    if (!confirm('Delete all ' + state.edges.length + ' signal path' + (state.edges.length === 1 ? '' : 's') + '? Icons and shapes stay. You can undo this.')) return;
    pushUndo(); const n = state.edges.length; state.edges = []; pruneSelection(); refresh(true); toast('Deleted ' + n + ' path' + (n === 1 ? '' : 's'));
  }
  else if (act === 'zoomSel') zoomToSelection();
  else if (act === 'grid') { state.showGrid = !state.showGrid; refresh(false); }
  else if (act === 'snap') { state.snap = !state.snap; refresh(false); }
  else if (act === 'export') { $('#exTheme').value = 'light'; updateExportInfo(); $('#dlgExport').showModal(); }
  else if (act === 'exCancel') $('#dlgExport').close();
  else if (act === 'exGo') doExport();
  else if (act === 'theme') { ui.theme = ui.theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('videodraw.theme', ui.theme); } catch (e) {} applyTheme(); refresh(false); }
  else if (act === 'zoomIn') zoomBy(1.25);
  else if (act === 'zoomOut') zoomBy(0.8);
  else if (act === 'fit') fitView();
});
$('#dlgExport').addEventListener('change', updateExportInfo);

// ---------- sample diagram ----------
function sampleDoc() {
  const d = blankDoc(); d.title = 'Sample studio';
  const cam1 = createNode('camera', 0, 0), cam2 = createNode('camera', 0, 120), pc = createNode('computer', 0, 240);
  const sw = createNode('atem1', 380, 40), rec = createNode('hyperdeck', 780, 0), mon = createNode('monitor', 780, 160), tv = createNode('tv', 780, 300);
  cam1.name = 'Camera 1'; cam2.name = 'Camera 2'; pc.name = 'Graphics PC'; mon.name = 'Multiview monitor'; tv.name = 'Lobby TV';
  tv.inputs = makePorts(TYPES.tv, 'in', 2); sizeNode(tv);
  cam1.outputs[0].sig = 'SDI 1080p59.94'; cam2.outputs[0].sig = 'SDI 1080p59.94'; pc.outputs[0].sig = 'HDMI';
  sw.inputs[0].sig = 'CAM 1'; sw.inputs[1].sig = 'CAM 2'; sw.inputs[2].sig = 'GFX';
  d.nodes.push(cam1, cam2, pc, sw, rec, mon, tv);
  const E = (a, b, extra) => Object.assign({ id: nid(), a: [a], b: [b], stroke: 'auto', width: 2, dash: 'solid', count: 1, label: '' }, extra || {});
  d.edges.push(E(cam1.outputs[0].id, sw.inputs[0].id), E(cam2.outputs[0].id, sw.inputs[1].id), E(pc.outputs[0].id, sw.inputs[2].id, { dash: 'dashed' }),
    E(sw.outputs[0].id, rec.inputs[0].id, { label: 'PGM' }), E(sw.outputs[6].id, mon.inputs[0].id, { stroke: '#3596db' }),
    { id: nid(), a: [sw.outputs[1].id, sw.outputs[2].id], b: [tv.inputs[0].id, tv.inputs[1].id], stroke: 'auto', width: 2, dash: 'solid', count: 2, label: 'AUX' });
  return d;
}

// ---------- init ----------
(function init() {
  try { const t = localStorage.getItem('videodraw.theme'); if (t === 'light' || t === 'dark') ui.theme = t; } catch (e) {}
  applyTheme();
  renderPalette();
  setTool('select');
  let loaded = false;
  try { const raw = localStorage.getItem('videodraw.doc'); if (raw) { const obj = JSON.parse(raw); if (obj && obj.nodes) { loadDoc(obj); loaded = true; } } } catch (e) {}
  if (!loaded) loadDoc(sampleDoc());
  setView();
  window.addEventListener('resize', () => renderOverlay(overlay, theme()));
})();
